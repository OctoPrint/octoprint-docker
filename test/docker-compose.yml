services:
  octoprint:
    build:
      context: ../
      args:
        octoprint_ref: 2.0.2
    image: octoprint/octoprint:test
    ports:
      - 53333:80
    volumes:
      - octoprint:/octoprint
    environment:
      - AUTOMIGRATE=true

  config-editor:
    image: linuxserver/code-server
    ports:
      - 8443:8443
    depends_on:
      - octoprint
    restart: unless-stopped
    environment:
      - PUID=0
      - PGID=0
      - TZ=America/Chicago
    volumes:
      - octoprint:/octoprint

volumes:
  octoprint:
