name: Build Images

# Builds and smoke-tests the images whose files changed, on pull requests into main.
# Run it by hand (Actions > Build Images > Run workflow) to build both images for any
# branch. It never publishes anything: release.yml does that.
# See "How the workflows run" in CONTRIBUTING.md.

on:
  # Not on push: a branch push and its pull request would both run, and cancelling the
  # duplicate shows up as failed checks on the pull request.
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    # bash with pipefail
    shell: bash

concurrency:
  # a new commit on a pull request (or branch) cancels the run for the commit it replaces
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-scripts:
    name: Release script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/test-release-scripts.sh

  changes:
    runs-on: ubuntu-latest
    outputs:
      # manual runs build both images
      variants: ${{ steps.filter.outputs.changes || '["main","minimal"]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: .github/filters.yml

  # No custom name: GitHub shows "build (main)" and "build (minimal)" when it runs, and
  # "build" when no image changed, rather than an unexpanded matrix expression.
  build:
    needs: changes
    if: needs.changes.outputs.variants != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.changes.outputs.variants) }}
    env:
      CONTEXT: ${{ matrix.variant == 'minimal' && './minimal' || '.' }}
      PORT: ${{ matrix.variant == 'minimal' && '5000' || '80' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get the latest stable OctoPrint release
        id: octoprint
        env:
          # authenticated, so it doesn't share the runner IP's anonymous rate limit (#297)
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(gh release view --repo OctoPrint/OctoPrint --json tagName --jq .tagName)
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm,arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build amd64 image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          load: true
          platforms: linux/amd64
          tags: octoprint-smoke:${{ matrix.variant }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          build-args: |
            octoprint_ref=${{ steps.octoprint.outputs.release }}
      - name: Smoke test
        timeout-minutes: 5
        run: ./scripts/smoke-test.sh "octoprint-smoke:${{ matrix.variant }}" "$PORT"
        env:
          EXPECTED_VERSION: ${{ steps.octoprint.outputs.release }}
      - name: Build all platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          push: false
          platforms: |
            linux/amd64
            linux/arm/v7
            linux/arm64
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
          build-args: |
            octoprint_ref=${{ steps.octoprint.outputs.release }}
