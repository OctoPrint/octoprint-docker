name: Build Images

on:
  push:
    branches-ignore:
      - master
  pull_request:
    branches:
      - master

jobs:
  filters:
    runs-on: ubuntu-latest
    outputs:
      main: ${{ steps.filter.outputs.main }}
      minimal: ${{ steps.filter.outputs.minimal }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - 
        uses: actions/checkout@v2
      - 
        uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: '.github/filters.yml'

  docker_build_main:
    runs-on: ubuntu-latest
    needs: filters
    if: ${{ needs.filters.outputs.main == 'true' || needs.filters.outputs.ci == 'true' }}
    
    steps:
      - 
        uses: actions/checkout@v2
      - 
        name: Get OctoPrint Stable
        id: latest-octoprint
        # authenticated, so it doesn't share the runner IP's anonymous rate limit (#297)
        run: echo "release=$(gh release view --repo OctoPrint/OctoPrint --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - 
        name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm,arm64
      -
        name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashfiles('**/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      -
        name: Build amd64 image for the smoke test
        uses: docker/build-push-action@v7
        with:
          load: true
          tags: octoprint-smoke:main
          cache-from: type=local,src=/tmp/.buildx-cache
          platforms: linux/amd64
          build-args: |
            octoprint_ref=${{ steps.latest-octoprint.outputs.release }}
      -
        name: Smoke test
        timeout-minutes: 5
        run: ./scripts/smoke-test.sh octoprint-smoke:main 80
        env:
          EXPECTED_VERSION: ${{ steps.latest-octoprint.outputs.release }}
      -
        name: Run a Test Build
        id: build
        uses: docker/build-push-action@v7
        with:
          push: false
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max
          platforms: |
            linux/amd64
            linux/arm/v7
            linux/arm64
          build-args: |
            octoprint_ref=${{ steps.latest-octoprint.outputs.release }}

  docker_build_minimal:
    runs-on: ubuntu-latest
    needs: filters
    if: ${{ needs.filters.outputs.minimal == 'true' || needs.filters.outputs.ci == 'true' }}
    
    steps:
      - 
        uses: actions/checkout@v2
      - 
        name: Get OctoPrint Stable
        id: latest-octoprint
        # authenticated, so it doesn't share the runner IP's anonymous rate limit (#297)
        run: echo "release=$(gh release view --repo OctoPrint/OctoPrint --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - 
        name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm,arm64
      -
        name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashfiles('**/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      -
        name: Build amd64 image for the smoke test
        uses: docker/build-push-action@v7
        with:
          load: true
          tags: octoprint-smoke:minimal
          context: ./minimal
          file: ./minimal/Dockerfile
          cache-from: type=local,src=/tmp/.buildx-cache
          platforms: linux/amd64
          build-args: |
            octoprint_ref=${{ steps.latest-octoprint.outputs.release }}
      -
        name: Smoke test
        timeout-minutes: 5
        run: ./scripts/smoke-test.sh octoprint-smoke:minimal 5000
        env:
          EXPECTED_VERSION: ${{ steps.latest-octoprint.outputs.release }}
      -
        name: Run a Test Build
        id: build
        uses: docker/build-push-action@v7
        with:
          push: false
          context: ./minimal
          file: ./minimal/Dockerfile
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max
          platforms: |
            linux/amd64
            linux/arm/v7
            linux/arm64
          build-args: |
            octoprint_ref=${{ steps.latest-octoprint.outputs.release }}

